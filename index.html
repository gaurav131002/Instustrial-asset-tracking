<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="description" content="Industrial Asset Tracking and Management Platform">
    <title>IndusTrack | Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body data-page="dashboard">
    <script src="js/common.js"></script>
    <script>
        renderShell("index", "Operations dashboard", "A modular DSA-II project for industrial asset visibility, maintenance and factory navigation.");
        const assets = loadAssets(), stats = [["Registered assets", assets.length, "assets.html"], ["Attention required", assets.filter(a => ["Maintenance", "Repair"].includes(a.status)).length, "maintenance.html"], ["Factory zones", zones.length, "factory-network.html"], ["Operational", assets.filter(a => a.status === "Operational").length, "assets.html"]];
        document.getElementById("pageContent").innerHTML = `<section class="stats">${stats.map(s => `<a class="stat-card dashboard-stat" href="${s[2]}"><span class="stat-label">${s[0]}</span><strong>${s[1]}</strong><span class="stat-foot">Open module →</span></a>`).join("")}</section><section class="module-grid">${[["assets.html", "▣", "Asset management", "BST inventory and asset records"], ["maintenance.html", "◷", "Maintenance", "Priority queue and work tracking"], ["factory-network.html", "⌘", "Factory network", "BFS, DFS, Dijkstra and MST"], ["spare-parts.html", "⌁", "Spare parts", "Inventory and procurement"], ["reports.html", "▤", "Factory reports", "Operational analytics and exports"]].map(m => `<a class="module-card" href="${m[0]}"><span class="module-icon">${m[1]}</span><h2>${m[2]}</h2><p>${m[3]}</p><span class="module-link">Open module →</span></a>`).join("")}</section>`;
    </script>
</body>

</html>
